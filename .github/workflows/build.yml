name: Build Biogram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Select required Xcode
      # ------------------------------------------------------------
      - name: Set active Xcode path
        shell: bash
        run: |
          set -e

          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Required Xcode: $XCODE_VERSION"

          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "ERROR: Xcode_${XCODE_VERSION}.app was not found"
            echo ""
            echo "Available Xcode versions:"
            ls -1 /Applications/ | grep Xcode || true
            exit 1
          fi

          xcodebuild -version

      # ------------------------------------------------------------
      # 3. Create canonical source directory
      # ------------------------------------------------------------
      - name: Create canonical source directory
        shell: bash
        run: |
          set -e
          set -x

          sudo mkdir -p /Users/Shared

          rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

          echo "Source directory:"
          ls -la /Users/Shared/telegram-ios

      # ------------------------------------------------------------
      # 4. Prepare configuration
      # ------------------------------------------------------------
      - name: Prepare build configuration
        shell: bash
        env:
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -e

          SOURCE_DIR=/Users/Shared/telegram-ios

          cd "$SOURCE_DIR"

          if [ -z "$TELEGRAM_API_HASH" ]; then
            echo "ERROR: TELEGRAM_API_HASH GitHub Secret is empty or missing."
            exit 1
          fi

          CONFIG="build-system/appstore-configuration.json"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Configuration file not found:"
            echo "$CONFIG"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          path = "build-system/appstore-configuration.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          config["api_hash"] = os.environ["TELEGRAM_API_HASH"]

          config["team_id"] = ""

          config["is_internal_build"] = "true"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["app_center_id"] = "0"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=4)
              f.write("\n")

          print("Build configuration prepared.")
          print("api_hash: injected from GitHub Secret")
          print("team_id: empty")
          print("is_internal_build:", config["is_internal_build"])
          print("is_appstore_build:", config["is_appstore_build"])
          PY

      # ------------------------------------------------------------
      # 5. Build Biogram
      # ------------------------------------------------------------
      - name: Build Biogram
        shell: bash
        run: |
          set -e
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"

          export COMMIT_COUNT="$(git rev-list --count HEAD)"
          export COMMIT_COUNT="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          export BUILD_NUMBER="$COMMIT_COUNT"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Biogram build"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "========================================"

          # --------------------------------------------------------
          # Import fake signing certificates
          # --------------------------------------------------------
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          # --------------------------------------------------------
          # Check provisioning profiles
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "Checking provisioning profiles"
          echo "========================================"

          for PROFILE in build-system/fake-codesigning/profiles/*.mobileprovision; do
            echo ""
            echo "----------------------------------------"
            echo "PROFILE: $PROFILE"
            echo "----------------------------------------"

            security cms -D \
              -i "$PROFILE" \
              -o /tmp/profile.plist

            echo "Bundle identifier:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              /tmp/profile.plist 2>/dev/null || true

            echo "APS environment:"
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              /tmp/profile.plist 2>/dev/null || echo "NO aps-environment"

          done

          echo ""
          echo "========================================"
          echo "Starting Make.py"
          echo "========================================"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      # ------------------------------------------------------------
      # 6. Collect IPA
      # ------------------------------------------------------------
      - name: Collect IPA
        shell: bash
        run: |
          set -e

          SOURCE_DIR=/Users/Shared/telegram-ios

          cd "$SOURCE_DIR"

          mkdir -p build/artifacts

          IPA_PATH="bazel-bin/Telegram/Swiftgram.ipa"

          echo "Looking for IPA:"
          ls -lh "$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not found!"
            echo ""
            echo "Searching for any IPA:"
            find bazel-bin -type f -name "*.ipa" -print || true
            exit 1
          fi

          cp "$IPA_PATH" "build/artifacts/Biogram.ipa"

          echo "========================================"
          echo "IPA successfully collected:"
          ls -lh build/artifacts/Biogram.ipa
          echo "========================================"

      # ------------------------------------------------------------
      # 7. Collect DSYMs
      # ------------------------------------------------------------
      - name: Collect DSYMs
        shell: bash
        continue-on-error: true
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios

          cd "$SOURCE_DIR"

          mkdir -p build/DSYMs

          echo "Searching for dSYM files..."

          find bazel-bin bazel-out \
            -type d \
            -name "*.dSYM" \
            -print \
            2>/dev/null || true

          find bazel-bin bazel-out \
            -type d \
            -name "*.dSYM" \
            -exec cp -R "{}" build/DSYMs/ \; \
            2>/dev/null || true

          if find build/DSYMs -type d -name "*.dSYM" | grep -q .; then

            echo "Creating DSYM archive..."

            cd build

            zip -r \
              "artifacts/Telegram.DSYMs.zip" \
              DSYMs \
              >/dev/null

            echo "DSYM archive created:"
            ls -lh artifacts/Telegram.DSYMs.zip

          else

            echo "No DSYM files found."
            echo "This is NOT a build failure."

          fi

      # ------------------------------------------------------------
      # 8. Verify IPA
      # ------------------------------------------------------------
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          SOURCE_DIR=/Users/Shared/telegram-ios
          IPA="$SOURCE_DIR/build/artifacts/Biogram.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: Biogram.ipa does not exist."
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA"

          echo ""
          echo "IPA file type:"
          file "$IPA"

          echo ""
          echo "IPA contents:"
          unzip -l "$IPA" | head -50

      # ------------------------------------------------------------
      # 9. Upload IPA artifact
      # ------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error
          retention-days: 7

      # ------------------------------------------------------------
      # 10. Upload DSYMs
      # ------------------------------------------------------------
      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Biogram-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: ignore
          retention-days: 7

      # ------------------------------------------------------------
      # 11. Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            IPA generated by GitHub Actions using fake-codesigning.
            The IPA can be used for subsequent local signing/sideloading.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
