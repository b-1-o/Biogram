name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "Requested Xcode: $XCODE_VERSION"

          if [ -d "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Requested Xcode not found, using default Xcode"
          fi

          xcodebuild -version
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -x

          sudo rm -rf /Users/Shared/telegram-ios
          sudo mkdir -p /Users/Shared

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -euxo pipefail

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "================================"
          echo "Biogram build"
          echo "Version: $APP_VERSION"
          echo "Build:   $BUILD_NUMBER"
          echo "================================"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect IPA and dSYM
        run: |
          set -euxo pipefail

          cd /Users/Shared/telegram-ios

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          echo "================================"
          echo "Looking for IPA"
          echo "================================"

          IPA_PATH=$(find bazel-bin bazel-out -type f -name "Swiftgram.ipa" -print -quit 2>/dev/null || true)

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: Swiftgram.ipa not found"
            find bazel-bin -maxdepth 4 -type f | head -100 || true
            exit 1
          fi

          echo "Found IPA:"
          echo "$IPA_PATH"

          cp "$IPA_PATH" "$OUTPUT_PATH/Biogram.ipa"

          echo "================================"
          echo "Looking for dSYM files"
          echo "================================"

          rm -rf build/DSYMs
          mkdir -p build/DSYMs

          DSYM_COUNT=0

          while IFS= read -r -d '' DSYM; do
            echo "Found dSYM: $DSYM"
            cp -R "$DSYM" build/DSYMs/
            DSYM_COUNT=$((DSYM_COUNT + 1))
          done < <(find bazel-bin bazel-out -type d -name "*.dSYM" -print0 2>/dev/null || true)

          echo "Found $DSYM_COUNT dSYM bundle(s)"

          if [ "$DSYM_COUNT" -gt 0 ]; then
            cd build
            zip -r "../$OUTPUT_PATH/Telegram.DSYMs.zip" DSYMs >/dev/null
            cd ..
          else
            echo "WARNING: No dSYM files found"
            echo "Creating empty dSYM archive so the workflow can continue"

            cd build
            zip -r "../$OUTPUT_PATH/Telegram.DSYMs.zip" DSYMs >/dev/null
            cd ..
          fi

          echo "================================"
          echo "Artifacts"
          echo "================================"

          ls -lh "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-dSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 7

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            Unsigned build for iOS.
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
