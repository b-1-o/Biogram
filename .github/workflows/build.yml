name: Biogram CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode
        run: |
          set -euo pipefail

          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"

          echo "Required Xcode: $XCODE_VERSION"

          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          echo "Xcode:"
          xcodebuild -version

          echo "Developer:"
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

          echo "Source directory:"
          ls -la /Users/Shared/telegram-ios

      - name: Prepare build environment
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Biogram build environment"
          echo "========================================"

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

          echo "Version:"
          python3 -c 'import json; print(json.load(open("versions.json"))["app"])'

          echo "Xcode:"
          python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])'

          echo "Bundle ID:"
          python3 -c 'import json; print(json.load(open("build-system/appstore-configuration.json"))["bundle_id"])'

          echo "Team ID:"
          python3 -c 'import json; print(json.load(open("build-system/appstore-configuration.json"))["team_id"])'

          echo "========================================"

      - name: Prepare fake codesigning
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          echo "Importing fake certificates..."

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo "Fake signing prepared."

      - name: Calculate build number
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION="$(
            python3 -c \
              'import json; print(json.load(open("versions.json"))["app"])'
          )"

          COMMIT_COUNT="$(git rev-list --count HEAD)"

          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Biogram build"
          echo "========================================"
          echo "App version:         $APP_VERSION"
          echo "Commit count:        $COMMIT_COUNT"
          echo "Build offset:        $BUILD_NUMBER_OFFSET"
          echo "Build number:        $BUILD_NUMBER"
          echo "Commit:              $(git rev-parse HEAD)"
          echo "Branch:              $(git branch --show-current)"
          echo "========================================"

      - name: Build Biogram
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Starting Biogram build"
          echo "========================================"
          echo "App version:  $APP_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "========================================"

          python3 -u \
            build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableProvisioningProfiles

      - name: Find IPA
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Searching for IPA"
          echo "========================================"

          find bazel-out \
            -type f \
            -name "*.ipa" \
            -print || true

          IPA_PATH="$(
            find bazel-out \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not produced."
            exit 1
          fi

          echo "IPA found:"
          echo "$IPA_PATH"

          mkdir -p build/artifacts

          cp "$IPA_PATH" build/artifacts/Biogram.ipa

          echo "IPA copied:"
          ls -lh build/artifacts/Biogram.ipa

      - name: Collect dSYMs
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          rm -rf build/DSYMs
          mkdir -p build/DSYMs

          find bazel-out \
            -type d \
            -name "*.dSYM" \
            -exec cp -R {} build/DSYMs/ \; \
            2>/dev/null || true

          if find build/DSYMs \
            -mindepth 1 \
            -maxdepth 1 \
            -print \
            -quit | grep -q .; then

            zip -r \
              build/artifacts/Biogram.DSYMs.zip \
              build/DSYMs

            echo "dSYMs created:"
            ls -lh build/artifacts/Biogram.DSYMs.zip
          else
            echo "No dSYMs found."
          fi

      - name: Verify IPA
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Verifying IPA"
          echo "========================================"

          test -f build/artifacts/Biogram.ipa

          unzip -l build/artifacts/Biogram.ipa | head -40

          echo "========================================"
          echo "IPA successfully created"
          echo "========================================"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error

      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Unsigned/fake-signed build intended for sideloading.
          draft: false
          prerelease: true
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
