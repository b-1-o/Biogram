name: Biogram CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Biogram
    runs-on: macos-13

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # XCODE
      # ============================================================
      - name: Set active Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_VERSION="$(
            python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["xcode"])
          '
          )"

          echo "Required Xcode: $XCODE_VERSION"

          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          if [ ! -d "$XCODE_PATH" ]; then
            echo "ERROR: Xcode was not found:"
            echo "$XCODE_PATH"
            echo
            echo "Installed Xcode versions:"
            ls -la /Applications/ | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"

          echo
          echo "Active Xcode:"
          xcode-select -p

          echo
          xcodebuild -version

      # ============================================================
      # CANONICAL SOURCE DIRECTORY
      # ============================================================
      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          sudo mkdir -p /Users/Shared

          sudo rm -rf "$SOURCE_DIR"

          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"

          sudo chown -R "$(whoami)":staff "$SOURCE_DIR"

          echo "Source directory:"
          echo "$SOURCE_DIR"

          ls -la "$SOURCE_DIR"

      # ============================================================
      # VERIFY REPOSITORY
      # ============================================================
      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Biogram build environment"
          echo "========================================"

          echo "Directory:"
          pwd

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "versions.json:"
          cat versions.json

          echo
          echo "build_number_offset:"
          cat build_number_offset

          echo
          echo "Telegram/BUILD:"
          git status --short Telegram/BUILD || true

          echo
          echo "========================================"

      # ============================================================
      # CALCULATE BUILD NUMBER
      # ============================================================
      - name: Calculate build number
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          # Read build number offset.
          BUILD_NUMBER_OFFSET="$(tr -d '[:space:]' < build_number_offset)"

          # Read application version.
          APP_VERSION="$(
            python3 -c '
          import json
          with open("versions.json") as f:
              print(json.load(f)["app"])
          '
          )"

          # Count commits.
          COMMIT_COUNT="$(git rev-list --count HEAD)"

          # IMPORTANT:
          # This MUST be Bash arithmetic.
          #
          # WRONG:
          # COMMIT_COUNT + BUILD_NUMBER_OFFSET
          #
          # CORRECT:
          # BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          #
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          # Validate values before starting the expensive build.
          if ! [[ "$BUILD_NUMBER_OFFSET" =~ ^[0-9]+$ ]]; then
            echo "ERROR: BUILD_NUMBER_OFFSET is not numeric:"
            echo "$BUILD_NUMBER_OFFSET"
            exit 1
          fi

          if ! [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: COMMIT_COUNT is not numeric:"
            echo "$COMMIT_COUNT"
            exit 1
          fi

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: BUILD_NUMBER is not numeric:"
            echo "$BUILD_NUMBER"
            exit 1
          fi

          # Export variables to subsequent GitHub Actions steps.
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Biogram build"
          echo "========================================"
          echo "App version:         $APP_VERSION"
          echo "Commit count:       $COMMIT_COUNT"
          echo "Build number offset: $BUILD_NUMBER_OFFSET"
          echo "Build number:       $BUILD_NUMBER"
          echo "Commit:             $(git rev-parse HEAD)"
          echo "Branch:             $(git branch --show-current)"
          echo "========================================"

      # ============================================================
      # PREPARE FAKE CODESIGNING
      # ============================================================
      - name: Prepare fake codesigning
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          echo "Preparing fake codesigning certificates..."

          python3 \
            build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo "Fake codesigning prepared."

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Biogram
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          echo
          echo "========================================"
          echo "Starting Biogram build"
          echo "========================================"
          echo "App version:  $APP_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "Configuration: release_arm64"
          echo "========================================"
          echo

          python3 -u \
            build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration="release_arm64" \
            --buildNumber="$BUILD_NUMBER"

          echo
          echo "========================================"
          echo "Biogram build completed"
          echo "========================================"

      # ============================================================
      # COLLECT ARTIFACTS
      # ============================================================
      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"

          rm -rf "$OUTPUT_PATH"

          mkdir -p "$OUTPUT_PATH"
          mkdir -p "$SOURCE_DIR/build/DSYMs"

          echo "========================================"
          echo "Collecting artifacts"
          echo "========================================"

          # ----------------------------------------------------------
          # IPA
          # ----------------------------------------------------------

          echo
          echo "Searching for Swiftgram.ipa..."

          IPA_PATH=""

          if [ -f "bazel-bin/Telegram/Swiftgram.ipa" ]; then
            IPA_PATH="bazel-bin/Telegram/Swiftgram.ipa"
          else
            IPA_PATH="$(
              find bazel-bin \
                -type f \
                -name "Swiftgram.ipa" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$IPA_PATH" ]; then
            echo
            echo "ERROR: Swiftgram.ipa was not found."
            echo
            echo "Available IPA files:"
            find bazel-bin bazel-out \
              -type f \
              -name "*.ipa" \
              -print \
              2>/dev/null || true

            echo
            echo "Telegram bazel-bin:"
            find bazel-bin/Telegram \
              -maxdepth 3 \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "Found IPA:"
          echo "$IPA_PATH"

          cp "$IPA_PATH" "$OUTPUT_PATH/Biogram.ipa"

          # ----------------------------------------------------------
          # DSYM
          # ----------------------------------------------------------

          echo
          echo "Searching for dSYM files..."

          DSYM_COUNT=0

          while IFS= read -r -d '' DSYM_PATH; do
            echo "Found dSYM:"
            echo "$DSYM_PATH"

            cp -R "$DSYM_PATH" "$SOURCE_DIR/build/DSYMs/"

            DSYM_COUNT=$((DSYM_COUNT + 1))
          done < <(
            find bazel-bin \
              -type d \
              -name "*.dSYM" \
              -print0 \
              2>/dev/null
          )

          if [ "$DSYM_COUNT" -gt 0 ]; then
            echo
            echo "Creating DSYM archive..."

            cd "$SOURCE_DIR"

            rm -f "$OUTPUT_PATH/Biogram.DSYMs.zip"

            zip -r \
              "$OUTPUT_PATH/Biogram.DSYMs.zip" \
              "build/DSYMs" \
              >/dev/null

            echo "DSYM archive created."
          else
            echo
            echo "WARNING: No dSYM files found."
          fi

          # ----------------------------------------------------------
          # FINAL
          # ----------------------------------------------------------

          echo
          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          ls -lah "$OUTPUT_PATH"

          echo
          echo "IPA:"
          ls -lh "$OUTPUT_PATH/Biogram.ipa"

          if [ -f "$OUTPUT_PATH/Biogram.DSYMs.zip" ]; then
            echo
            echo "DSYM:"
            ls -lh "$OUTPUT_PATH/Biogram.DSYMs.zip"
          fi

          echo
          echo "========================================"

      # ============================================================
      # UPLOAD IPA
      # ============================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # UPLOAD DSYM
      # ============================================================
      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # CREATE GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            # Biogram iOS

            **Version:** ${{ env.APP_VERSION }}

            **Build:** ${{ env.BUILD_NUMBER }}

            **Commit:** ${{ github.sha }}

            **Branch:** ${{ github.ref_name }}

            Automatically generated Biogram iOS build.
          draft: false
          prerelease: true
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
