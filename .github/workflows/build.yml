name: Biogram CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode
        run: |
          set -euo pipefail

          XCODE_VERSION="$(
            python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])'
          )"

          echo "Required Xcode: $XCODE_VERSION"

          sudo xcode-select -s \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          echo "Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo mkdir -p /Users/Shared

          sudo rm -rf /Users/Shared/telegram-ios

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

          echo "Source directory:"
          ls -la /Users/Shared/telegram-ios

      - name: Prepare build environment
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Biogram build environment"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo
          echo "Git branch:"
          git branch --show-current

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Git status:"
          git status --short

          echo
          echo "Telegram/BUILD status:"
          git status --short Telegram/BUILD || true

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Bazel:"
          bazel --version || true

          echo
          echo "Repository:"
          ls -la

          echo "========================================"

      - name: Prepare fake codesigning
        run: |
          set -euo pipefail

          cd /Users/Shared/telegram-ios

          echo "Preparing fake codesigning certificates..."

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo "Fake codesigning prepared."

      - name: Calculate build number
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          echo "Calculating build number..."

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION="$(
            python3 -c \
            'import json; print(json.load(open("versions.json"))["app"])'
          )"

          COMMIT_COUNT="$(git rev-list --count HEAD)"

          # IMPORTANT:
          # Bash arithmetic must use $((...)).
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid BUILD_NUMBER: '$BUILD_NUMBER'"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "Biogram build"
          echo "========================================"
          echo "App version:         $APP_VERSION"
          echo "Commit count:        $COMMIT_COUNT"
          echo "Build number offset: $BUILD_NUMBER_OFFSET"
          echo "Build number:        $BUILD_NUMBER"
          echo "Commit:              $(git rev-parse HEAD)"
          echo "Branch:              $(git branch --show-current)"
          echo "========================================"
          echo

      - name: Build Biogram
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Starting Biogram build"
          echo "========================================"
          echo "App version:  $APP_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "========================================"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: BUILD_NUMBER is invalid:"
            echo "'$BUILD_NUMBER'"
            exit 1
          fi

          python3 -u \
            build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect build artifacts
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"

          cd "$SOURCE_DIR"

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          echo "========================================"
          echo "Collecting build artifacts"
          echo "========================================"

          echo
          echo "Searching for IPA..."

          IPA_PATH=""

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              IPA_PATH="$file"
              break
            fi
          done < <(
            find bazel-out \
              -type f \
              -name '*.ipa' \
              -print 2>/dev/null || true
          )

          if [ -z "$IPA_PATH" ]; then
            echo
            echo "ERROR: IPA was not found."
            echo
            echo "Searching all Bazel outputs:"
            find bazel-bin bazel-out \
              -type f \
              \( -name '*.ipa' -o -name '*.dSYM' \) \
              -print 2>/dev/null || true

            echo
            echo "Build directory:"
            find build \
              -maxdepth 4 \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Found IPA:"
          echo "$IPA_PATH"

          cp "$IPA_PATH" "$OUTPUT_PATH/Biogram.ipa"

          echo
          echo "Searching for dSYM files..."

          rm -rf build/DSYMs
          mkdir -p build/DSYMs

          find bazel-out \
            -type d \
            -name '*.dSYM' \
            -exec cp -R {} build/DSYMs/ \; \
            2>/dev/null || true

          if find build/DSYMs \
            -mindepth 1 \
            -maxdepth 1 \
            -print -quit | grep -q .; then

            echo "Creating DSYM archive..."

            cd "$SOURCE_DIR"

            zip -r \
              "$OUTPUT_PATH/Biogram.DSYMs.zip" \
              build/DSYMs

          else
            echo "No dSYM files found."
          fi

          echo
          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          ls -lah "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error

      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            This build was generated automatically by GitHub Actions.
          draft: false
          prerelease: true
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
