name: Biogram CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # XCODE
      # ============================================================
      - name: Set active Xcode
        run: |
          set -euo pipefail

          XCODE_VERSION="$(
            python3 -c \
            'import json; print(json.load(open("versions.json"))["xcode"])'
          )"

          echo "Required Xcode: $XCODE_VERSION"

          if [ ! -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            echo "ERROR: Xcode_${XCODE_VERSION}.app not found"
            ls -1 /Applications/ | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          echo "Xcode version:"
          xcodebuild -version
          echo "Developer directory:"
          xcode-select -p

      # ============================================================
      # CANONICAL SOURCE DIRECTORY
      # ============================================================
      - name: Create canonical source directory
        run: |
          set -euo pipefail

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios

          sudo cp -R \
            "$GITHUB_WORKSPACE" \
            /Users/Shared/telegram-ios

          sudo chown -R "$(whoami)" \
            /Users/Shared/telegram-ios

          cd /Users/Shared/telegram-ios

          echo "Source directory:"
          pwd
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # PREPARE CONFIGURATION
      # ============================================================
      - name: Prepare build configuration
        env:
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          python3 - <<'PY'
          import json
          import os

          path = "build-system/appstore-configuration.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if api_hash:
              config["api_hash"] = api_hash

          # team_id обязателен и должен совпадать с fake profiles
          config["team_id"] = "FAKE123456"

          config["is_internal_build"] = "true"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["app_center_id"] = "0"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=4)
              f.write("\n")

          print("Build configuration prepared.")
          print("bundle_id:", config.get("bundle_id"))
          print("team_id:", config.get("team_id"))
          print("api_hash set:", bool(config.get("api_hash")))
          print("is_internal_build:", config.get("is_internal_build"))
          print("is_appstore_build:", config.get("is_appstore_build"))
          PY

          echo
          echo "Final configuration:"
          cat build-system/appstore-configuration.json

      # ============================================================
      # FAKE CODE SIGNING
      # ============================================================
      - name: Prepare fake codesigning
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          echo "Importing fake codesigning certificate..."
          python3 \
            build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          echo
          echo "Available signing identities:"
          security find-identity -v -p codesigning || true

      # ============================================================
      # GENERATE BIOGRAM PROFILES (best-effort)
      # ============================================================
      - name: Generate Biogram provisioning profiles
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          echo "========================================"
          echo "Generating Biogram provisioning profiles"
          echo "========================================"

          if [ -f build-system/Make/GenerateBiogramProfiles.py ]; then
            python3 build-system/Make/GenerateBiogramProfiles.py || true
          else
            echo "GenerateBiogramProfiles.py not found, skipping"
          fi

          echo
          echo "Profiles present:"
          find build-system/fake-codesigning/profiles \
            -maxdepth 1 -type f -name "*.mobileprovision" -print || true

      # ============================================================
      # BUILD NUMBER
      # ============================================================
      - name: Calculate build number
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(
            python3 -c \
            'import json; print(json.load(open("versions.json"))["app"])'
          )"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Starting Biogram build"
          echo "========================================"
          echo "App version: $APP_VERSION"
          echo "Commit count: $COMMIT_COUNT"
          echo "Build number offset: $BUILD_NUMBER_OFFSET"
          echo "Build number: $BUILD_NUMBER"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo "========================================"

      # ============================================================
      # BUILD BIOGRAM
      # ============================================================
      - name: Build Biogram
        run: |
          set -euo pipefail

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          echo "========================================"
          echo "Patching build system for sideload IPA"
          echo "========================================"

          # ------------------------------------------------------------
          # HARD FIX 1: DirectoryCodesigningSource always returns APS
          # ------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-system/Make/BuildConfiguration.py")
          text = path.read_text(encoding="utf-8")

          old = """    def resolve_aps_environment(self):
        return resolve_aps_environment_from_directory(source_path=self.directory_path + '/profiles', team_id=self.team_id, bundle_id=self.bundle_id)"""

          new = """    def resolve_aps_environment(self):
        value = resolve_aps_environment_from_directory(source_path=self.directory_path + '/profiles', team_id=self.team_id, bundle_id=self.bundle_id)
        if value is None:
            print('Biogram CI: aps-environment missing in profiles, forcing production')
            return 'production'
        return value"""

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
              print("OK: patched DirectoryCodesigningSource.resolve_aps_environment")
          else:
              print("WARN: exact DirectoryCodesigningSource block not found, trying broader patch")

              # broader fallback: any resolve_aps_environment in DirectoryCodesigningSource class
              marker = "class DirectoryCodesigningSource"
              if marker not in text:
                  raise SystemExit("ERROR: DirectoryCodesigningSource class not found")

              # last-resort: force resolve_aps_environment_from_directory final return
              text2 = text.replace(
                  "                    return profile_dict['Entitlements']['aps-environment']\n    return None",
                  "                    return profile_dict['Entitlements']['aps-environment']\n    print('Biogram CI: forcing production aps-environment')\n    return 'production'",
                  1,
              )
              if text2 == text:
                  # ultra fallback
                  text2 = text.replace("\n    return None\n", "\n    print('Biogram CI: forcing production aps-environment')\n    return 'production'\n", 1)

              path.write_text(text2, encoding="utf-8")
              print("OK: applied broader APS fallback patch")
          PY

          # ------------------------------------------------------------
          # HARD FIX 2: Make.py never exits on missing APS
          # ------------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-system/Make/Make.py")
          text = path.read_text(encoding="utf-8")

          old = """        else:
            print(
                'Could not find a valid aps-environment entitlement '
                'in the provided provisioning profiles'
            )
            sys.exit(1)"""

          new = """        else:
            print(
                'Could not find a valid aps-environment entitlement '
                'in the provided provisioning profiles'
            )
            print('Biogram CI: ignoring APS error and forcing development')
            codesigning_data = ResolvedCodesigningData(
                aps_environment='development',
                use_xcode_managed_codesigning=codesigning_data.use_xcode_managed_codesigning
            )"""

          if old not in text:
              # alternate formatting
              old2 = "Could not find a valid aps-environment entitlement "
              if old2 not in text:
                  raise SystemExit("ERROR: APS error block not found in Make.py")

              # replace sys.exit(1) that follows this message once
              idx = text.find(old2)
              chunk = text[idx:idx+500]
              if "sys.exit(1)" not in chunk:
                  raise SystemExit("ERROR: sys.exit(1) after APS message not found")

              text = text[:idx] + chunk.replace(
                  "sys.exit(1)",
                  "print('Biogram CI: forcing aps_environment=development'); codesigning_data = ResolvedCodesigningData(aps_environment='development', use_xcode_managed_codesigning=codesigning_data.use_xcode_managed_codesigning)",
                  1,
              ) + text[idx+500:]
              path.write_text(text, encoding="utf-8")
              print("OK: patched Make.py APS exit (alternate)")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("OK: patched Make.py APS exit")
          PY

          echo
          echo "========================================"
          echo "Building Biogram"
          echo "========================================"
          echo "App version: $APP_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo

          python3 -u \
            build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableProvisioningProfiles

      # ============================================================
      # COLLECT IPA
      # ============================================================
      - name: Collect IPA
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          echo "Searching for IPA..."

          IPA_PATH="$(
            find bazel-out bazel-bin \
              -type f -name "*.ipa" -print -quit 2>/dev/null || true
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA was not found."
            echo "Searching entire tree..."
            find . -type f -name "*.ipa" -print 2>/dev/null || true
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          cp "$IPA_PATH" "$OUTPUT_PATH/Biogram.ipa"

          echo
          echo "Biogram IPA:"
          ls -lh "$OUTPUT_PATH/Biogram.ipa"

      # ============================================================
      # COLLECT DSYMS
      # ============================================================
      - name: Collect dSYMs
        continue-on-error: true
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          OUTPUT_PATH="build/artifacts"
          rm -rf build/DSYMs
          mkdir -p build/DSYMs

          find bazel-out bazel-bin \
            -type d -name "*.dSYM" \
            -exec cp -R {} build/DSYMs/ \; 2>/dev/null || true

          if find build/DSYMs -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
            zip -r "$OUTPUT_PATH/Biogram.DSYMs.zip" build/DSYMs >/dev/null
            echo "dSYM archive created."
          else
            echo "No dSYM files found."
          fi

          echo
          echo "Final artifacts:"
          ls -lah "$OUTPUT_PATH"

      # ============================================================
      # UPLOAD IPA
      # ============================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # UPLOAD DSYM
      # ============================================================
      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Biogram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # GITHUB RELEASE
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            This IPA is intended for sideloading
            with Sideloadly or another compatible
            signing tool.
          draft: false
          prerelease: true
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Biogram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
