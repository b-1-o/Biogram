name: CI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode path
        shell: bash
        run: |
          set -e

          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')

          echo "Required Xcode: $XCODE_VERSION"

          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "ERROR: Xcode_${XCODE_VERSION}.app was not found"
            echo "Available Xcode versions:"
            ls -1 /Applications/ | grep Xcode || true
            exit 1
          fi

          xcodebuild -version

      - name: Create canonical source directory
        shell: bash
        run: |
          set -e
          set -x

          sudo mkdir -p /Users/Shared

          cp -R "$GITHUB_WORKSPACE" /Users/Shared/

          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" \
             /Users/Shared/telegram-ios

      - name: Build Biogram
        shell: bash
        run: |
          set -e
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios

          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')

          export COMMIT_COUNT="$(git rev-list --count HEAD)"
          export COMMIT_COUNT="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          export BUILD_NUMBER="$COMMIT_COUNT"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Biogram build"
          echo "APP_VERSION=$APP_VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          echo "========================================"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      # IMPORTANT:
      # IPA is copied immediately after the successful build.
      # Nothing related to DSYM can make the IPA step fail.
      - name: Collect IPA
        shell: bash
        run: |
          set -e

          SOURCE_DIR=/Users/Shared/telegram-ios

          cd "$SOURCE_DIR"

          mkdir -p build/artifacts

          IPA_PATH="bazel-bin/Telegram/Swiftgram.ipa"

          echo "Looking for IPA:"
          ls -lh "$IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not found!"
            exit 1
          fi

          cp "$IPA_PATH" "build/artifacts/Biogram.ipa"

          echo "========================================"
          echo "IPA successfully collected:"
          ls -lh build/artifacts/Biogram.ipa
          echo "========================================"

      # DSYM is OPTIONAL.
      # If something goes wrong here, the build continues.
      - name: Collect DSYMs
        shell: bash
        continue-on-error: true
        run: |
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios

          cd "$SOURCE_DIR"

          mkdir -p build/DSYMs

          echo "Searching for dSYM files..."

          find bazel-bin bazel-out \
            -type d \
            -name "*.dSYM" \
            -print \
            2>/dev/null || true

          find bazel-bin bazel-out \
            -type d \
            -name "*.dSYM" \
            -exec cp -R "{}" build/DSYMs/ \; \
            2>/dev/null || true

          if find build/DSYMs -type d -name "*.dSYM" | grep -q .; then
            echo "Creating DSYM archive..."

            cd build

            zip -r \
              "artifacts/Telegram.DSYMs.zip" \
              DSYMs \
              >/dev/null

            echo "DSYM archive created:"
            ls -lh artifacts/Telegram.DSYMs.zip
          else
            echo "No DSYM files found."
            echo "This is NOT a build failure."
          fi

      - name: Verify IPA
        shell: bash
        run: |
          set -e

          SOURCE_DIR=/Users/Shared/telegram-ios

          if [ ! -f "$SOURCE_DIR/build/artifacts/Biogram.ipa" ]; then
            echo "ERROR: Biogram.ipa does not exist."
            exit 1
          fi

          echo "IPA:"
          ls -lh "$SOURCE_DIR/build/artifacts/Biogram.ipa"

          echo ""
          echo "IPA file type:"
          file "$SOURCE_DIR/build/artifacts/Biogram.ipa"

      # This is an additional safety net.
      # Even if the Release creation fails, the IPA remains available
      # in the workflow artifacts.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biogram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload DSYM artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Biogram-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.BUILD_NUMBER }}"
          name: "Biogram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})"
          body: |
            Biogram iOS build

            Version: ${{ env.APP_VERSION }}
            Build: ${{ env.BUILD_NUMBER }}

            Unsigned iOS IPA generated by GitHub Actions.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Biogram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
